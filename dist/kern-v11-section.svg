text x="45" y="1918" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#536970" text-anchor="start">Controller: 1.23 m crouched / 1.80 m standing including hover. Traversal still needs an in-game test.</text><text x="45" y="1961" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#536970" text-anchor="start">Slabs: additional 0.3 m dark bands. Lift pit / overrun, structure and fire strategy remain provisional.</text></svg>